<!doctype html>
<!-- The implementation that threw the supplied design away and rebuilt it in
     a house style: same structure, same spacing, same content band - and an
     entirely different type scale (30 / 13 / 11 instead of 48 / 20 / 16) and
     an entirely different palette (gold on near-black instead of amber on
     warm paper). It must report exactly those two things, plus the summary
     that says a supplied design is preserved rather than rebuilt. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coastal Survey</title>
<style>
  html, body { margin: 0; }
  body { background: #0c0a03; font-family: Georgia, "Times New Roman", serif; }
  .page { padding: 32px; }
  h1, h2 { font-size: 30px; color: #e8c46a; margin: 0 0 24px; line-height: 1.1; }
  p { font-size: 13px; color: #9a9a9a; margin: 0 0 24px; line-height: 1.6; }
  .label { display: block; font-size: 11px; color: #9a9a9a; margin: 0 0 24px; }
</style>
</head>
<body>
<div class="page">
  <h1>Coastal Survey</h1>
  <h2>Shingle and saltmarsh</h2>
  <p>Forty miles of shingle, walked twice a year since 1974.</p>
  <p>The counts are kept by hand and typed up in March.</p>
  <span class="label">Shingle</span>
  <span class="label">Saltmarsh</span>
</div>
</body>
</html>

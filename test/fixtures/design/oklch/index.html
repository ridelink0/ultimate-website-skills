<!doctype html>
<!-- The match fixture again, with one thing changed: the palette is written in
     oklch() instead of hex. Same colours, same type scale, same rhythm - the
     page a house-style build produces, because core.css defines its whole
     palette in oklch.

     getComputedStyle does NOT normalise this: Chrome hands back
     "oklch(55.53% 0.1455 49)" verbatim, and a comparison that reads the
     numbers out of an rgb() string sees no colour at all. Before the probes
     converted colours, this file reported "3 text colours are not in the
     design" and named the design's own colours back. It must report nothing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coastal Survey</title>
<style>
  html, body { margin: 0; }
  body { background: oklch(97.71% 0.0074 80.7); font-family: Georgia, "Times New Roman", serif; }
  .page { padding: 32px; }
  h1 { font-size: 48px; color: oklch(55.53% 0.1455 49.0); margin: 0 0 24px; line-height: 1.1; }
  p { font-size: 16px; color: oklch(40.71% 0.0098 106.8); margin: 0 0 24px; line-height: 1.6; }
  .label { display: block; font-size: 20px; color: oklch(40.71% 0.0098 106.8); margin: 0 0 24px; }
</style>
</head>
<body>
<div class="page">
  <h1>Coastal Survey</h1>
  <p>Forty miles of shingle, walked twice a year since 1974.</p>
  <p>The counts are kept by hand and typed up in March.</p>
  <span class="label">Shingle</span>
  <span class="label">Saltmarsh</span>
</div>
</body>
</html>

<title>140 character measure fixture</title>
<h1 style="font-size:48px">Too wide to track</h1>
<p style="font:10px/1.4 monospace;max-width:900px">This paragraph is set in monospace at a width chosen so the rendered line runs past a hundred and forty characters before it ever has to wrap onto a second line at all, which is the whole point of the fixture.</p>

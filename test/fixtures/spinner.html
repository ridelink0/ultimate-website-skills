<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>loading spinner fixture</title>
<style>body{margin:0;padding:32px;font:18px system-ui}h1{font-size:48px;margin:0 0 24px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:48px;height:48px;border:4px solid #d8d4c8;border-top-color:#b45309;border-radius:50%;animation:spin 1s linear infinite}</style>
<h1>A loading state</h1>
<div class="spinner" role="progressbar" aria-label="Loading"></div>
</html>
